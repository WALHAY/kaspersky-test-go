name: threat-exchange-tests

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: threats_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d threats_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    image: golang:1.26.10
    working_dir: /src
    volumes:
      - .:/src:ro
    environment:
      TEST_DATABASE_URL: postgres://test:test-only-password@db:5432/threats_test?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    command: ["go", "test", "-race", "-tags=integration", "-count=1", "./..."]
