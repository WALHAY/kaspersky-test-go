name: threat-exchange

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: threats
      POSTGRES_USER: threats
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threats -d threats"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    image: threat-exchange:local
    environment:
      DATABASE_URL: "postgres://threats:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/threats?sslmode=disable"
      API_KEY: "${API_KEY:?Set API_KEY in .env}"
      HTTP_ADDR: ":8080"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-60}"
      MAX_BODY_BYTES: "${MAX_BODY_BYTES:-65536}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-5s}"
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
