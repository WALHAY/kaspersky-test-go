name: Go checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: threats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d threats_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://test:test-only-password@localhost:5432/threats_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check-generated
      - run: make integration vet build
      # Build the pinned linter with the project's Go version.
      - run: make lint
      - name: Build container
        run: docker build -t threat-exchange:ci .
