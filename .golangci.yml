version: "2"
run:
  timeout: 5m
  build-tags: [integration]
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    generated: strict
    rules:
      - path: ^generated/
        linters: [errcheck, govet, ineffassign, staticcheck, unused]
formatters:
  enable:
    - gofmt
